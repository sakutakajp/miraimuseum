<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ocean Diorama — 小さな海</title>
  <meta name="description" content="白い台座に広がる青い海。波の高さと速さを調整しながら、小さな海を眺める3Dジオラマ。" />
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: radial-gradient(ellipse at 78% 24%, #c5edff 0%, #aedfff 48%, #8fc8f4 100%); }
    #viewport { position: fixed; inset: 0; touch-action: none; }
    canvas { display: block; width: 100%; height: 100%; }
    :focus-visible { outline: 3px solid #007aa8; outline-offset: 3px; }
    #status { position: fixed; inset: 45% 20px auto; z-index: 9; text-align: center; color: #163e59; }
    #status:empty { display: none; }
    .ocean-bubble {
      position: absolute; z-index: 4; width: 78px; height: 54px;
      padding: 0 0 8px; margin: 0;
      transform: translate(-50%, calc(-100% - 18px));
      background: #fff; color: #173b50; border: 2px solid #20465c; border-radius: 20px;
      font-family: inherit; font-size: 32px; line-height: 1; font-weight: 600;
      box-shadow: 0 6px 22px rgba(15, 68, 105, .19); cursor: pointer;
    }
    .ocean-bubble::after {
      content: ''; position: absolute; left: calc(50% - 7.5px); bottom: -8px;
      width: 15px; height: 15px; transform: rotate(45deg);
      background: inherit; border-radius: 0 0 3px 0;
      border-right: 2px solid #20465c; border-bottom: 2px solid #20465c;
    }
    .ocean-bubble[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="viewport" aria-label="アニメーションする四角い海のジオラマ"></div>
  <div id="status" role="status">海を読み込んでいます…</div>
  <script type="module">
    const status = document.getElementById('status');
    let stage = 'load';
    try {
      const { createOceanScene } = await import('./src/createOceanScene.js?v=safari-1');
      stage = 'render';
      const ocean = createOceanScene(document.getElementById('viewport'));
      status.textContent = '';
      const canvas = document.querySelector('canvas');
      canvas.addEventListener('webglcontextlost', (event) => {
        event.preventDefault();
        status.textContent = '描画が中断されました。復帰しない場合はページを再読み込みしてください。';
      });
      canvas.addEventListener('webglcontextrestored', () => { status.textContent = ''; });
      window.addEventListener('pagehide', (event) => { if (!event.persisted) ocean.dispose(); });
    } catch (error) {
      console.error(`Ocean Diorama startup failed (${stage}):`, error);
      status.textContent = stage === 'load'
        ? '海のデータを読み込めませんでした。ページを再読み込みしてください。'
        : error.code === 'OCEAN_WEBGL_CONTEXT'
          ? '3Dの描画を開始できませんでした。ほかのタブを閉じてから再読み込みしてください。'
          : '海の表示を開始できませんでした。ページを再読み込みしてください。';
    }
  </script>
</body>
</html>
